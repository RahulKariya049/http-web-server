<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <rect width="400" height="220" fill="#E7EEF8"/>

  <!-- isometric wireframe cube -->
  <g stroke="#1D4E89" stroke-width="1.6" fill="none" stroke-linejoin="round">
    <path d="M140,50 L200,85 L200,155 L140,190 L80,155 L80,85 Z"/>
    <path d="M140,120 L200,85" opacity="0.55"/>
    <path d="M140,120 L140,190" opacity="0.55"/>
    <path d="M140,120 L80,85" opacity="0.55"/>
  </g>

  <!-- basis vectors radiating from the cube's center, with arrowheads -->
  <g stroke="#C9A15C" stroke-width="2" stroke-linecap="round">
    <line x1="140" y1="120" x2="60" y2="60"/>
    <line x1="140" y1="120" x2="235" y2="45"/>
    <line x1="140" y1="120" x2="150" y2="20"/>
  </g>
  <g fill="#C9A15C">
    <path d="M60,60 L70,58 L64,68 Z"/>
    <path d="M235,45 L226,50 L230,38 Z"/>
    <path d="M150,20 L145,29 L156,29 Z"/>
  </g>

  <!-- projectile trajectory, a nod to physics in game engines -->
  <path d="M255,175 Q305,90 380,180" fill="none" stroke="#1D4E89" stroke-width="1.5" stroke-dasharray="5 6" opacity="0.6"/>
  <circle cx="255" cy="175" r="5" fill="#1D4E89"/>
  <circle cx="330" cy="112" r="5" fill="#C9A15C"/>
  <circle cx="380" cy="180" r="3.5" fill="#1D4E89" opacity="0.5"/>

  <!-- ground plane hint -->
  <line x1="40" y1="200" x2="380" y2="200" stroke="#1D4E89" stroke-width="1" opacity="0.15"/>
</svg>