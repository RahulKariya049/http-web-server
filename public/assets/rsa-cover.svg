<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <rect width="400" height="220" fill="#E7EEF8"/>

  <!-- modular arithmetic chord diagram (times-table mod 12), the pattern behind RSA-style number theory -->
  <circle cx="200" cy="110" r="70" fill="none" stroke="#1D4E89" stroke-width="1.5" opacity="0.5"/>

  <g stroke="#C9A15C" stroke-width="1.1" opacity="0.7">
    <line x1="200" y1="40" x2="260.6" y2="75"/>
    <line x1="235" y1="49.4" x2="260.6" y2="145"/>
    <line x1="260.6" y1="75" x2="200" y2="180"/>
    <line x1="270" y1="110" x2="139.4" y2="145"/>
    <line x1="260.6" y1="145" x2="130" y2="110"/>
    <line x1="235" y1="170.6" x2="139.4" y2="75"/>
    <line x1="200" y1="180" x2="200" y2="40"/>
    <line x1="165" y1="170.6" x2="260.6" y2="75"/>
    <line x1="139.4" y1="145" x2="260.6" y2="145"/>
    <line x1="130" y1="110" x2="200" y2="180"/>
    <line x1="139.4" y1="75" x2="139.4" y2="145"/>
    <line x1="165" y1="49.4" x2="130" y2="110"/>
  </g>

  <g fill="#1D4E89">
    <circle cx="200" cy="40" r="3"/>
    <circle cx="235" cy="49.4" r="3"/>
    <circle cx="260.6" cy="75" r="3"/>
    <circle cx="270" cy="110" r="3"/>
    <circle cx="260.6" cy="145" r="3"/>
    <circle cx="235" cy="170.6" r="3"/>
    <circle cx="200" cy="180" r="3"/>
    <circle cx="165" cy="170.6" r="3"/>
    <circle cx="139.4" cy="145" r="3"/>
    <circle cx="130" cy="110" r="3"/>
    <circle cx="139.4" cy="75" r="3"/>
    <circle cx="165" cy="49.4" r="3"/>
  </g>

  <!-- small padlock, nodding to encryption -->
  <g transform="translate(38,34)">
    <path d="M4 12 V8 a8 8 0 0 1 16 0 v4" fill="none" stroke="#1D4E89" stroke-width="2" stroke-linecap="round"/>
    <rect x="0" y="12" width="24" height="18" rx="3" fill="#1D4E89"/>
    <circle cx="12" cy="20" r="2.4" fill="#E7EEF8"/>
  </g>
</svg>